<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="ttl desc">
<title id="ttl">ArasTey — orbital globe HUD</title>
<desc id="desc">A rotating wireframe globe with a tilted orbital ring, a glowing arc travelling from a point on the left to one on the right, and telemetry readouts in the corners.</desc>

<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<style>
  .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  /* the globe spins on its axis */
  .gl { transform-box: view-box; transform-origin: 350px 148px; animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* the counter-rotating meridian set */
  .gl2 { transform-box: view-box; transform-origin: 350px 148px; animation: spinr 9s linear infinite; }
  @keyframes spinr { to { transform: rotate(-360deg); } }

  /* the orbital ring rides around the globe, opposite to the spin */
  .ring { transform-box: view-box; transform-origin: 350px 148px; animation: spinr 6s linear infinite; }

  /* contact points hold their orbit and pulse */
  .pt { animation: pt 2.4s ease-in-out infinite; }
  @keyframes pt { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* the travelling arc — offset-path keeps the head on the curve */
  .arc {
    offset-path: path("M120 200 Q350 18 580 200");
    animation: arc 2.2s cubic-bezier(.5, 0, .5, 1) infinite;
  }
  @keyframes arc {
    0%   { offset-distance: 0%;   opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .gl, .gl2, .ring, .pt, .arc { animation: none !important; }
    .arc { offset-distance: 100%; opacity: 1; }
  }
</style>

<rect x="5" y="5" width="690" height="290" rx="13" fill="#03060c" stroke="#1b2534"/>

<!-- ══ telemetry frame ══ -->
<g stroke="#164e63" stroke-width="1" opacity=".85" fill="none">
  <path d="M26 58 V26 h44"/>
  <path d="M630 26 h44 v32"/>
  <path d="M674 242 v32 h-44"/>
  <path d="M70 274 h-44 v-32"/>
</g>
<text class="t" x="26" y="45" font-size="9" fill="#164e63" letter-spacing="2.2">NET.MESH // TRACE</text>
<text class="t" x="674" y="45" font-size="9" fill="#22c55e" text-anchor="end" letter-spacing="2.2">LINK ACTIVE</text>
<text class="t" x="26" y="286" font-size="9" fill="#164e63" letter-spacing="2.2">ORIGIN UNKNOWN</text>
<text class="t" x="674" y="286" font-size="9" fill="#164e63" text-anchor="end" letter-spacing="2.2">NO SERVER OF MINE</text>

<!-- ══ the globe ══ -->
<g fill="none" stroke="#155e75" stroke-width="1.1">
  <circle cx="350" cy="148" r="74"/>

  <g class="gl">
    <ellipse cx="350" cy="148" rx="74" ry="26"/>
    <ellipse cx="350" cy="148" rx="74" ry="52"/>
    <ellipse cx="350" cy="148" rx="26" ry="74"/>
    <ellipse cx="350" cy="148" rx="52" ry="74"/>
    <path d="M276 148 h148"/>
  </g>

  <g class="gl2" opacity=".45">
    <path d="M288 110 Q350 148 288 186"/>
    <path d="M412 110 Q350 148 412 186"/>
  </g>
</g>

<!-- ══ orbital ring ══ -->
<g class="ring" fill="none">
  <ellipse cx="350" cy="148" rx="112" ry="34" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.4"/>
</g>
<ellipse cx="350" cy="148" rx="112" ry="34" fill="none" stroke="#22d3ee" stroke-opacity=".2"
         stroke-width="1.4" transform="rotate(62 350 148)"/>

<!-- ══ contact points ══ -->
<circle class="pt" cx="422" cy="148" r="3" fill="#22d3ee"/>
<circle class="pt" style="animation-delay:.6s"  cx="350" cy="74"  r="3" fill="#22d3ee"/>
<circle class="pt" style="animation-delay:1.2s" cx="278" cy="148" r="3" fill="#22d3ee"/>

<!-- ══ the long way around ══ -->
<path d="M120 200 Q350 18 580 200" fill="none" stroke="#164e63" stroke-width="1" stroke-dasharray="3 5"/>
<circle class="arc" cx="0" cy="0" r="6" fill="#a3e635" filter="url(#glow)"/>

<!-- ══ endpoints ══ -->
<circle cx="120" cy="200" r="5" fill="#38bdf8"/>
<circle cx="580" cy="200" r="5" fill="#a3e635"/>
<text class="t" x="120" y="222" font-size="9.5" fill="#38bdf8" text-anchor="middle">HERE</text>
<text class="t" x="580" y="222" font-size="9.5" fill="#a3e635" text-anchor="middle">OUT</text>

<!-- ══ caption ══ -->
<text class="t" x="350" y="262" font-size="11.5" fill="#5b6b80" text-anchor="middle">the long way around is still the way</text>
</svg>