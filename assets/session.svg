<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img" aria-labelledby="ttl desc">
<title id="ttl">ArasTey — ArasClient carrying traffic past a censorship filter</title>
<desc id="desc">ArasClient runs locally with no backend. A censorship filter sits across the path and is struck through, while encrypted packets travel through a Cloudflare Worker tunnel to an open destination.</desc>

<style>
  .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  /* packets travel the tunnel: track (430px) ends exactly at the node edge */
  .pk { animation: travel 2.6s linear infinite; }
  @keyframes travel { from { transform: translateX(0); } to { transform: translateX(430px); } }

  /* staggered so the tunnel always looks busy */
  .d1 { animation-delay: 0s; }   .d2 { animation-delay: .4s; }  .d3 { animation-delay: .8s; }
  .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.6s; } .d6 { animation-delay: 2s; }

  /* the filter tries to stop it, and gives up */
  .wall { transform-box: fill-box; transform-origin: center; animation: shake .4s cubic-bezier(.36,.07,.19,.97) 1.1s 3; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); }
  }
  .strike { animation: draw .5s ease-out .95s both; }
  @keyframes draw { from { stroke-dashoffset: 64; } to { stroke-dashoffset: 0; } }

  /* destination breathes once traffic lands */
  .node { transform-box: fill-box; transform-origin: center; animation: breathe 2.6s ease-in-out 1.5s infinite; }
  @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

  .live { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

  .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .pk, .wall, .strike, .node, .live, .rise { animation: none !important; }
    .strike { stroke-dashoffset: 0; }
  }
</style>

<rect x="6" y="6" width="688" height="368" rx="14" fill="#0b0f16" stroke="#1f2937"/>

<!-- header -->
<g class="rise" style="animation-delay:.1s">
  <text class="t" x="34" y="42" font-size="12" fill="#6b7280">aras@arastey — ~/anti-censorship</text>
  <circle class="live" cx="612" cy="37" r="5" fill="#22c55e"/>
  <text class="t" x="624" y="42" font-size="10.5" fill="#22c55e" text-anchor="end" letter-spacing="1.4">LIVE</text>
</g>
<path d="M22 60 h656" stroke="#1f2937" fill="none"/>

<!-- ── the tunnel track ── -->
<rect x="150" y="176" width="430" height="10" rx="5" fill="#0f1b2a"/>
<rect x="150" y="176" width="430" height="10" rx="5" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
<text class="t" x="452" y="166" font-size="10" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">CLOUDFLARE WORKER TUNNEL</text>

<!-- ── the filter, sitting across the path ── -->
<g class="wall" style="animation-delay:1.1s">
  <rect x="248" y="104" width="100" height="154" rx="10" fill="#2a1416" stroke="#7f1d1d"/>
  <g stroke="#ef4444" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round">
    <path d="M260 118 L336 244"/><path d="M336 118 L260 244"/>
    <path d="M260 166 L336 210"/><path d="M336 166 L260 210"/>
    <path d="M260 214 L336 150"/>
  </g>
  <rect class="strike" x="262" y="167" width="64" height="28" rx="6" fill="none"
        stroke="#f87171" stroke-width="3.5" stroke-linecap="round"
        stroke-dasharray="64" stroke-dashoffset="64"/>
  <text class="t" x="298" y="284" font-size="11" fill="#f87171" text-anchor="middle">FILTER</text>
  <text class="t" x="298" y="301" font-size="9.5" fill="#7f1d1d" text-anchor="middle">BLOCKED</text>
</g>

<!-- ── packets in flight, over the filter ── -->
<g>
  <rect class="pk d1" x="150" y="177" width="26" height="8" rx="4" fill="#22c55e" opacity=".9"/>
  <rect class="pk d2" x="150" y="177" width="18" height="8" rx="4" fill="#4ade80" opacity=".75"/>
  <rect class="pk d3" x="150" y="177" width="22" height="8" rx="4" fill="#22c55e" opacity=".6"/>
  <rect class="pk d4" x="150" y="177" width="14" height="8" rx="4" fill="#38bdf8" opacity=".7"/>
  <rect class="pk d5" x="150" y="177" width="24" height="8" rx="4" fill="#22c55e" opacity=".5"/>
  <rect class="pk d6" x="150" y="177" width="16" height="8" rx="4" fill="#4ade80" opacity=".65"/>
</g>

<!-- ── the open destination ── -->
<g>
  <circle class="node" cx="606" cy="181" r="26" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <path d="M595 181 l8 8 l15 -16" fill="none" stroke="#4ade80" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="606" y="232" font-size="10" fill="#22c55e" text-anchor="middle" letter-spacing="1">OPEN</text>
</g>

<!-- ── ArasClient, running locally ── -->
<g class="rise" style="animation-delay:.3s">
  <rect x="30" y="150" width="120" height="62" rx="9" fill="#0f172a" stroke="#334155"/>
  <text class="t" x="44" y="174" font-size="12.5" fill="#38bdf8">ArasClient</text>
  <text class="t" x="44" y="192" font-size="9.5" fill="#64748b">client-side</text>
  <text class="t" x="44" y="205" font-size="9.5" fill="#64748b">no backend</text>
</g>

<!-- ── caption ── -->
<g class="rise" style="animation-delay:.55s">
  <text class="t" x="34" y="344" font-size="12.5" fill="#c9d1d9">the filter blocks the request. the tunnel doesn't negotiate.</text>
  <text class="t" x="666" y="344" font-size="12.5" fill="#38bdf8" text-anchor="end">$ arasc --connect</text>
</g>
</svg>