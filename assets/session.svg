<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-labelledby="ttl desc">
<title id="ttl">ArasTey — packets getting through</title>
<desc id="desc">A censorship filter wall on the left is struck through, while encrypted packets travel from a local client through a Cloudflare Worker tunnel to an open destination on the right.</desc>

<style>
  .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  /* packets travel the tunnel */
  /* packets travel the tunnel; 418px = track (408) + the 10px gap to the node */
  .pk { animation: travel 2.6s linear infinite; }
  @keyframes travel { from { transform: translateX(0); } to { transform: translateX(418px); } }

  /* staggered travel, so the tunnel always feels busy */
  .d1 { animation-delay: 0s; } .d2 { animation-delay: .42s; } .d3 { animation-delay: .84s; }
  .d4 { animation-delay: 1.26s; } .d5 { animation-delay: 1.68s; } .d6 { animation-delay: 2.1s; }

  /* the filter tries, and fails */
  .wall { transform-box: fill-box; transform-origin: center; animation: shake .42s cubic-bezier(.36,.07,.19,.97) 1.2s 3; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); } 40%, 60% { transform: translateX(5px); }
  }
  .strike { animation: draw .5s ease-out 1.05s both; }
  @keyframes draw { from { stroke-dashoffset: 62; } to { stroke-dashoffset: 0; } }

  /* destination node breathes once traffic lands */
  .node { transform-box: fill-box; transform-origin: center; animation: breathe 2.6s ease-in-out 1.6s infinite; }
  @keyframes breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }

  /* live indicator */
  .live { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

  /* title fades up */
  .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .pk, .wall, .strike, .node, .live, .rise { animation: none !important; }
    .strike { stroke-dashoffset: 0; }
  }
</style>

<rect x="6" y="6" width="688" height="360" rx="14" fill="#0b0f16" stroke="#1f2937"/>

<!-- header -->
<g class="rise" style="animation-delay:.1s">
  <text class="t" x="34" y="42" font-size="12" fill="#6b7280">aras@arastey — ~/circumvention</text>
  <circle class="live" cx="614" cy="37" r="5" fill="#22c55e"/>
  <text class="t" x="626" y="42" font-size="10.5" fill="#22c55e" text-anchor="end" letter-spacing="1.4">LIVE</text>
</g>
<path d="M22 60 h656" stroke="#1f2937" fill="none"/>

<!-- ── the censorship filter ── -->
<g class="wall" style="animation-delay:1.2s">
  <rect x="42" y="106" width="112" height="150" rx="10" fill="#2a1416" stroke="#7f1d1d"/>
  <g stroke="#ef4444" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round">
    <path d="M56 126 L140 236"/><path d="M140 126 L56 236"/>
    <path d="M56 168 L140 236"/><path d="M140 168 L56 236"/>
    <path d="M56 210 L140 126"/>
  </g>
  <rect class="strike" x="56" y="168" width="62" height="26" rx="6" fill="none"
        stroke="#f87171" stroke-width="3.5" stroke-linecap="round"
        stroke-dasharray="62" stroke-dashoffset="62"/>
  <text class="t" x="98" y="284" font-size="11" fill="#f87171" text-anchor="middle">FILTER</text>
  <text class="t" x="98" y="301" font-size="9.5" fill="#7f1d1d" text-anchor="middle">BLOCKED</text>
</g>

<!-- ── the tunnel ── -->
<g>
  <rect x="182" y="176" width="408" height="10" rx="5" fill="#0f1b2a"/>
  <rect x="182" y="176" width="408" height="10" rx="5" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <text class="t" x="386" y="166" font-size="10" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">CLOUDFLARE WORKER TUNNEL</text>

  <!-- packets in flight -->
  <g>
    <rect class="pk d1" x="182" y="177" width="26" height="8" rx="4" fill="#22c55e" opacity=".9"/>
    <rect class="pk d2" x="182" y="177" width="18" height="8" rx="4" fill="#4ade80" opacity=".75"/>
    <rect class="pk d3" x="182" y="177" width="22" height="8" rx="4" fill="#22c55e" opacity=".6"/>
    <rect class="pk d4" x="182" y="177" width="14" height="8" rx="4" fill="#38bdf8" opacity=".7"/>
    <rect class="pk d5" x="182" y="177" width="24" height="8" rx="4" fill="#22c55e" opacity=".5"/>
    <rect class="pk d6" x="182" y="177" width="16" height="8" rx="4" fill="#4ade80" opacity=".65"/>
  </g>
</g>

<!-- ── the open destination ── -->
<g>
  <circle class="node" cx="626" cy="181" r="26" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <path d="M615 181 l8 8 l15 -16" fill="none" stroke="#4ade80" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="626" y="232" font-size="10" fill="#22c55e" text-anchor="middle" letter-spacing="1">OPEN</text>
</g>

<!-- ── client ── -->
<g class="rise" style="animation-delay:.3s">
  <rect x="30" y="152" width="132" height="58" rx="9" fill="#0f172a" stroke="#334155"/>
  <text class="t" x="46" y="176" font-size="11.5" fill="#e5e7eb">ArasClient</text>
  <text class="t" x="46" y="194" font-size="9.5" fill="#64748b">local · client-side</text>
</g>

<!-- ── caption ── -->
<g class="rise" style="animation-delay:.55s">
  <text class="t" x="34" y="340" font-size="12.5" fill="#c9d1d9">the filter blocks the request. the tunnel doesn't negotiate.</text>
  <text class="t" x="666" y="340" font-size="12.5" fill="#38bdf8" text-anchor="end">$ arasc --connect</text>
</g>
</svg>