<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" role="img" aria-labelledby="ttl desc">
<title id="ttl">ArasTey — animated terminal session</title>
<desc id="desc">A terminal window showing an ArasClient connection: a typed connect command, Smart Connect racing servers, a 41 ms latency result on VLESS with REALITY, an .arasc container in locked state, and a tunnel progress bar at 82 percent.</desc>

<style>
  .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .row { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* type the command one character at a time */
  .typed { clip-path: inset(0 100% 0 0); animation: type 2.4s steps(32, end) .7s both; }
  @keyframes type { to { clip-path: inset(0 -4% 0 0); } }

  .caret { animation: blink 1.15s steps(1, end) 3.4s infinite; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* tunnel fills left to right */
  .fill { transform-box: fill-box; transform-origin: left center; animation: fill 3.1s cubic-bezier(.22,.9,.24,1) 3.9s both; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* the live indicator breathes */
  .live { transform-box: fill-box; transform-origin: center; animation: pulse 2.1s ease-in-out 4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.72); } 50% { opacity: 1; transform: scale(1.15); } }

  /* latency segments light up left to right; --o carries each tier's resting opacity */
  .seg { opacity: var(--o, 1); animation: pop .3s ease-out both; }
  @keyframes pop { from { opacity: 0; } to { opacity: var(--o, 1); } }

  /* a slow shimmer sweeping the established tunnel */
  .sheen { transform-box: fill-box; transform-origin: center; animation: sheen 3.4s ease-in-out 7s infinite; }
  @keyframes sheen { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(320%); } }

  @media (prefers-reduced-motion: reduce) {
    .row, .seg, .fill { opacity: 1; animation: none; }
    .typed { clip-path: none; animation: none; }
    .fill { transform: scaleX(1); }
    .caret, .live, .sheen { animation: none; opacity: 1; }
  }
</style>

<!-- window -->
<rect x="8" y="8" width="644" height="334" rx="14" fill="#0b0f16" stroke="#1f2937"/>
<path d="M8 46 h644" stroke="#1f2937" fill="none"/>

<!-- title bar -->
<circle cx="30" cy="27" r="5.5" fill="#ff5f57"/>
<circle cx="48" cy="27" r="5.5" fill="#febc2e"/>
<circle cx="66" cy="27" r="5.5" fill="#28c840"/>
<text class="t" x="88" y="32" font-size="12" fill="#6b7280">aras@arastey — ~/client</text>

<!-- live dot -->
<circle class="live" cx="600" cy="27" r="5" fill="#22c55e"/>
<text class="t" x="612" y="32" font-size="10.5" fill="#22c55e" text-anchor="end" letter-spacing="1.4">LIVE</text>

<g class="t" font-size="13.5">

  <!-- command -->
  <g class="typed">
    <text x="48" y="80" fill="#e5e7eb"><tspan fill="#38bdf8">$</tspan><tspan> arasc --connect --region auto</tspan></text>
  </g>
  <rect class="caret" x="316" y="68" width="9" height="15" fill="#38bdf8"/>

  <!-- smart-connect -->
  <g class="row" style="animation-delay:2.5s">
    <text x="48" y="116" fill="#22c55e">&#10003;</text>
    <text x="68" y="116" fill="#9ca3af">smart-connect</text>
    <text x="200" y="116" fill="#e5e7eb">3 servers raced</text>
  </g>

  <!-- latency -->
  <g class="row" style="animation-delay:2.85s">
    <text x="48" y="140" fill="#22c55e">&#10003;</text>
    <text x="68" y="140" fill="#9ca3af">latency</text>
    <text x="200" y="140" fill="#e5e7eb">41 ms</text>
    <rect class="seg" style="animation-delay:3.3s;  --o:1"    x="268" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect class="seg" style="animation-delay:3.42s; --o:.88"  x="284" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect class="seg" style="animation-delay:3.54s; --o:.88"  x="300" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect class="seg" style="animation-delay:3.66s; --o:.76"  x="316" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect class="seg" style="animation-delay:3.78s; --o:.76"  x="332" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect class="seg" style="animation-delay:3.90s; --o:.64"  x="348" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect class="seg" style="animation-delay:4.02s; --o:.64"  x="364" y="131" width="12" height="10" rx="2" fill="#22c55e"/>
    <rect x="380" y="131" width="12" height="10" rx="2" fill="#1f2937"/>
  </g>

  <!-- protocol -->
  <g class="row" style="animation-delay:3.2s">
    <text x="48" y="164" fill="#22c55e">&#10003;</text>
    <text x="68" y="164" fill="#9ca3af">protocol</text>
    <text x="200" y="164" fill="#e5e7eb">VLESS</text>
    <text x="252" y="164" fill="#64748b">·</text>
    <text x="266" y="164" fill="#38bdf8">REALITY</text>
  </g>

  <!-- container -->
  <g class="row" style="animation-delay:3.55s">
    <text x="48" y="188" fill="#22c55e">&#10003;</text>
    <text x="68" y="188" fill="#9ca3af">container</text>
    <text x="200" y="188" fill="#e5e7eb">.arasc</text>
    <rect x="258" y="178" width="58" height="14" rx="7" fill="#14532d" stroke="#22c55e" stroke-opacity=".55"/>
    <text x="287" y="188.5" font-size="9.5" fill="#4ade80" text-anchor="middle" letter-spacing=".6">LOCKED</text>
  </g>

  <!-- tunnel -->
  <g class="row" style="animation-delay:3.9s">
    <text x="48" y="226" fill="#9ca3af">tunnel established</text>
  </g>

  <g>
    <rect x="48" y="241" width="354" height="14" rx="7" fill="#132033"/>
    <rect class="fill" x="48" y="241" width="290" height="14" rx="7" fill="#22c55e"/>
    <rect class="sheen" x="48" y="241" width="46" height="14" rx="7" fill="#ffffff" opacity=".22"/>
    <text class="row" style="animation-delay:6.9s" x="416" y="253" fill="#22c55e">82%</text>
  </g>

  <!-- prompt -->
  <g class="row" style="animation-delay:7.2s">
    <text x="48" y="290" fill="#38bdf8">&gt;</text>
    <rect class="caret" x="64" y="278" width="9" height="15" fill="#38bdf8"/>
  </g>

</g>
</svg>