<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="ArasTey — Anti-censorship tooling and privacy-first clients">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#1c2a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#101418" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="820" height="220" rx="16" fill="url(#bg)"/>
  <rect width="820" height="220" rx="16" fill="url(#vig)"/>

  <!-- twinkling stars -->
  <g fill="#7dd3fc">
    <circle cx="330" cy="34" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="560" cy="52" r="1.1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.1s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="700" cy="30" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="770" cy="96" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.6s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="480" cy="26" r="1.0"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.1s" repeatCount="indefinite" begin="1.8s"/></circle>
    <circle cx="640" cy="120" r="1.2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.3s" repeatCount="indefinite" begin="0.9s"/></circle>
  </g>

  <!-- globe -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.4">
    <ellipse cx="140" cy="110" rx="86" ry="86"/>
    <ellipse cx="140" cy="110" rx="60" ry="86"/>
    <ellipse cx="140" cy="110" rx="86" ry="34"/>
    <path d="M54 110h172"/>
  </g>

  <!-- travelling arc on the globe rim -->
  <circle cx="140" cy="110" r="86" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2.6"/>
  <circle cx="140" cy="110" r="86" fill="none" stroke="url(#glow)" stroke-width="2.6" stroke-linecap="round"
          stroke-dasharray="140 400" transform="rotate(-90 140 110)">
    <animate attributeName="stroke-dashoffset" from="540" to="0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- local node with pulsing halo -->
  <circle cx="140" cy="110" r="3.2" fill="#ffd166"/>
  <circle cx="140" cy="110" r="6" fill="none" stroke="#ffd166" stroke-width="1.4" opacity="0.8">
    <animate attributeName="r" values="4;13;4" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="262" y="92" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#title)">Hi, I'm ArasTey</text>

  <!-- alternating taglines -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">
    <text x="264" y="126">Anti-censorship tooling &amp; privacy-first clients
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.32;0.34;0.98;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="264" y="126" opacity="0">Persian-first · RTL native copy
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.64;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="264" y="126" opacity="0">Built for people behind firewalls
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.66;0.98;0.98;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- pills -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="264" y="150" width="150" height="26" rx="13" fill="#12212e" stroke="#38bdf8" stroke-opacity="0.5"/>
    <circle cx="280" cy="163" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="292" y="167" fill="#7dd3fc">Persian-first</text>
    <rect x="424" y="150" width="168" height="26" rx="13" fill="#12212e" stroke="#ffd166" stroke-opacity="0.45"/>
    <text x="438" y="167" fill="#ffd166">client-side by default</text>
  </g>

  <!-- bottom line with shimmer sweep -->
  <path d="M24 196 H 796" stroke="#1f2b3a" stroke-width="2"/>
  <path d="M24 196 H 796" stroke="url(#shimmer)" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="240 560">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="3.2s" repeatCount="indefinite"/>
  </path>
</svg>
